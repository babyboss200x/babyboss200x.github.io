<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden;}
    a-scene {width: 100%;  height: 100%;}
  </style>
</head>

<body>
<a-scene mindar-face embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-assets>
    <a-asset-item id="glassesModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/glasses/scene.gltf"></a-asset-item>
    <a-asset-item id="headModel" src="https://babyboss200x.github.io/witch_hat.glb"></a-asset-item>
  </a-assets>

  <!-- แว่น: เกาะดั้งจมูก (anchor 168) -->
  <a-entity mindar-face-target="anchorIndex: 168">
    <a-gltf-model
        rotation="0 0 0" position="0 0 0" scale="0.008 0.008 0.008"
        src="#glassesModel">
    </a-gltf-model>
  </a-entity>

  <!-- หมวก: เกาะหว่างคิ้ว (anchor 10) แล้วเลื่อนขึ้นไปบนหัว -->
  <a-entity mindar-face-target="anchorIndex: 10">
    <a-gltf-model
        rotation="0 0 0" position="0 0.2 0" scale="0.3 0.3 0.3"
        src="#headModel">
    </a-gltf-model>
  </a-entity>

  <a-camera active="false" position="0 0 0"> </a-camera>

</a-scene>
</body>
</html>
