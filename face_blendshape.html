
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Face AR</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }
    #container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    #start {
      position: fixed;
      z-index: 10;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 14px 24px;
      border: 0;
      border-radius: 12px;
      font-size: 18px;
      background: white;
      cursor: pointer;
    }
    #status {
      position: fixed;
      z-index: 10;
      top: 15px;
      left: 10px;
      right: 10px;
      color: white;
      text-align: center;
      background: #0009;
      padding: 10px;
      border-radius: 8px;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
    }
  }
  </script>
</head>

<body>
  <div id="container"></div>
  <div id="status">กดปุ่มเพื่อเปิดกล้อง</div>
  <button id="start">เปิดกล้อง</button>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { MindARThree } from "mindar-face-three";

    const MODEL_URL =
      "https://babyboss200x.github.io/bossfinal.glb";

    const container = document.querySelector("#container");
    const startButton = document.querySelector("#start");
    const status = document.querySelector("#status");

    let mindar = null;
    let started = false;

    startButton.addEventListener("click", async () => {
      if (started) return;

      startButton.disabled = true;
      status.textContent = "กำลังโหลดโมเดล...";

      try {
        const loader = new GLTFLoader();

        const gltf = await loader.loadAsync(MODEL_URL);
        const model = gltf.scene;

        // ปรับขนาดและจุดกึ่งกลางของโมเดล
        model.updateMatrixWorld(true);

        const bounds = new THREE.Box3().setFromObject(model);
        const size = bounds.getSize(new THREE.Vector3());
        const center = bounds.getCenter(new THREE.Vector3());

        if (!Number.isFinite(size.x) ||
            !Number.isFinite(size.y) ||
            !Number.isFinite(size.z) ||
            Math.max(size.x, size.y, size.z) === 0) {
          throw new Error("โมเดลมีขนาดไม่ถูกต้อง");
        }

        model.position.sub(center);

        // ขนาดเริ่มต้น ปรับได้ตามโมเดลจริง
        const targetWidth = 0.18;
        const scale = targetWidth / Math.max(size.x, size.y);

        model.scale.setScalar(scale);

        mindar = new MindARThree({
          container: container,
          uiLoading: "no",
          uiScanning: "no",
          uiError: "no",
          filterMinCF: 0.0001,
          filterBeta: 0.001
        });

        const { renderer, scene, camera } = mindar;

        scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, 2));

        const light = new THREE.DirectionalLight(0xffffff, 2);
        light.position.set(0, 1, 2);
        scene.add(light);

        // 168 เป็นจุดอ้างอิงบริเวณใบหน้า
        const anchor = mindar.addAnchor(168);
        anchor.group.add(model);

        status.textContent = "กำลังเปิดกล้อง...";

        await mindar.start();

        renderer.setAnimationLoop(() => {
          renderer.render(scene, camera);
        });

        started = true;
        startButton.style.display = "none";
        status.textContent = "ตรวจจับใบหน้าแล้ว";

        anchor.onTargetFound = () => {
          status.textContent = "ตรวจพบใบหน้า";
        };

        anchor.onTargetLost = () => {
          status.textContent = "กำลังค้นหาใบหน้า...";
        };

      } catch (error) {
        console.error(error);
        status.textContent =
          "เปิดไม่สำเร็จ: " + (error.message || error);
        startButton.disabled = false;
      }
    });
  </script>
</body>
</html>
