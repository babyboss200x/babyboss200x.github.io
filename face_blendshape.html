
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MindAR Blendshape</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
    }
  }
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #container {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { MindARThree } from 'mindar-face-three';

    const mindar = new MindARThree({
      container: document.querySelector('#container')
    });

    const { renderer, scene, camera } = mindar;

    // แสงและ Environment
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    const roomEnvironment = new RoomEnvironment();
    const environmentTarget =
      pmremGenerator.fromScene(roomEnvironment);

    scene.environment = environmentTarget.texture;

    roomEnvironment.dispose();
    pmremGenerator.dispose();

    scene.add(
      new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1)
    );

    // โหลดโมเดล
    const model = await new GLTFLoader().loadAsync(
      'https://babyboss200x.github.io/boss11.glb'
    );

    // ปรับขนาดและตำแหน่งโมเดล
    model.scene.scale.setScalar(1.5);
    model.scene.position.set(0, 0.08, 0.05);

    // วางโมเดลบนใบหน้า
    const anchor = mindar.addAnchor(1);
    anchor.group.add(model.scene);

    // ค้นหา Mesh ที่รองรับ Blendshape
    const meshes = [];

    model.scene.traverse(object => {
      if (
        object.isMesh &&
        object.morphTargetDictionary &&
        object.morphTargetInfluences
      ) {
        meshes.push(object);
      }
    });

    // เปิดกล้อง
    await mindar.start();

    // แสดงผลและขยับ Blendshape ตามใบหน้า
    function animate() {
      const categories =
        mindar.getLatestEstimate()?.blendshapes?.categories;

      for (const mesh of meshes) {
        for (const { categoryName, score } of categories ?? []) {
          const index =
            mesh.morphTargetDictionary[categoryName];

          if (index !== undefined) {
            mesh.morphTargetInfluences[index] = score;
          }
        }
      }

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
