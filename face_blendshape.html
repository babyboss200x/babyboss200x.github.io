
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boss Face Tracking</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      background: #111;
    }

    #container {
      width: 100vw;
      height: 100dvh;
      position: relative;
      overflow: hidden;
    }

    #status {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      padding: 10px 14px;
      border-radius: 8px;
      background: #222c;
      color: white;
      font: 14px Arial, sans-serif;
      white-space: nowrap;
    }

    #controls {
      position: absolute;
      z-index: 5;
      bottom: 15px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px;
    }

    button {
      color: white;
      background: #252525e8;
      border: 1px solid #777;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div id="container">
    <div id="status">กำลังโหลดโมเดล...</div>

    <div id="controls">
      <button id="left">← ซ้าย</button>
      <button id="right">ขวา →</button>
      <button id="up">↑ ขึ้น</button>
      <button id="down">↓ ลง</button>
      <button id="smaller">เล็กลง</button>
      <button id="bigger">ใหญ่ขึ้น</button>
      <button id="reset">รีเซ็ต</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from
      'three/addons/loaders/GLTFLoader.js';
    import { MindARThree } from 'mindar-face-three';

    const container = document.querySelector('#container');
    const status = document.querySelector('#status');

    const MODEL_URL =
      'https://babyboss200x.github.io/boss09.glb';

    // ค่าปรับตำแหน่งเริ่มต้น
    let posX = 0;
    let posY = -0.05;
    let posZ = 0.02;
    let scale = 0.45;

    const initial = {
      x: posX,
      y: posY,
      z: posZ,
      scale
    };

    const mindar = new MindARThree({
      container,
      maxTrack: 1
    });

    const { renderer, scene, camera } = mindar;

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    // แสงพื้นฐาน
    scene.add(
      new THREE.HemisphereLight(0xffffff, 0x777788, 2)
    );

    const light = new THREE.DirectionalLight(0xffffff, 2);
    light.position.set(0, 1, 2);
    scene.add(light);

    let wrapper;
    let modelMeshes = [];

    function updateTransform() {
      if (!wrapper) return;

      wrapper.position.set(posX, posY, posZ);
      wrapper.scale.setScalar(scale);
    }

    function changePosition(axis, amount) {
      if (axis === 'x') posX += amount;
      if (axis === 'y') posY += amount;
      updateTransform();
    }

    document.querySelector('#left').onclick =
      () => changePosition('x', -0.02);

    document.querySelector('#right').onclick =
      () => changePosition('x', 0.02);

    document.querySelector('#up').onclick =
      () => changePosition('y', 0.02);

    document.querySelector('#down').onclick =
      () => changePosition('y', -0.02);

    document.querySelector('#smaller').onclick = () => {
      scale = Math.max(0.05, scale * 0.9);
      updateTransform();
    };

    document.querySelector('#bigger').onclick = () => {
      scale *= 1.1;
      updateTransform();
    };

    document.querySelector('#reset').onclick = () => {
      posX = initial.x;
      posY = initial.y;
      posZ = initial.z;
      scale = initial.scale;
      updateTransform();
    };

    try {
      const gltf = await new GLTFLoader().loadAsync(MODEL_URL);

      const model = gltf.scene;

      // จัด Origin ของโมเดลให้อยู่กึ่งกลางขอบเขตโมเดล
      // ช่วยให้การเลื่อนตำแหน่งอ้างอิงจุดกลางได้ง่ายขึ้น
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());

      model.position.sub(center);

      // Wrapper สำหรับเลื่อนโมเดลเทียบกับใบหน้า
      wrapper = new THREE.Group();
      wrapper.add(model);
      updateTransform();

      model.traverse(object => {
        if (
          object.isMesh &&
          object.morphTargetDictionary &&
          object.morphTargetInfluences
        ) {
          modelMeshes.push(object);
        }
      });

      // ผูกโมเดลเข้ากับ Face Anchor
      const anchor = mindar.addAnchor(1);
      anchor.group.add(wrapper);

      status.textContent = 'กำลังเปิดกล้อง...';
      await mindar.start();

      status.textContent =
        `ติดตามใบหน้าแล้ว | Blendshape Mesh: ${modelMeshes.length}`;

      renderer.setAnimationLoop(() => {
        const categories =
          mindar.getLatestEstimate()?.blendshapes?.categories;

        if (categories) {
          for (const mesh of modelMeshes) {
            for (const { categoryName, score } of categories) {
              const index =
                mesh.morphTargetDictionary[categoryName];

              if (index !== undefined) {
                mesh.morphTargetInfluences[index] = score;
              }
            }
          }
        }

        renderer.render(scene, camera);
      });

    } catch (error) {
      console.error(error);
      status.textContent =
        'โหลดไม่สำเร็จ ตรวจสอบลิงก์โมเดลและสิทธิ์กล้อง';
    }

    window.addEventListener('resize', () => {
      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );
    });
  </script>
</body>
</html>
