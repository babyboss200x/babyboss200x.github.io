
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MindAR Blendshape</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
    }
  }
  </script>

  <style>
    body { margin: 0; }
    #container {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { MindARThree } from 'mindar-face-three';

    const mindar = new MindARThree({
      container: document.querySelector('#container')
    });

    const { renderer, scene, camera } = mindar;

    // แสงและวัสดุ
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    const roomEnvironment = new RoomEnvironment();
    const environmentTarget =
      pmremGenerator.fromScene(roomEnvironment);

    scene.environment = environmentTarget.texture;
    roomEnvironment.dispose();
    pmremGenerator.dispose();

    scene.add(
      new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1)
    );

    // โหลดโมเดลจาก GitHub Pages
    const MODEL_URL =
      'https://babyboss200x.github.io/babyboss200x.github.io/boss16.glb';

    const gltf = await new GLTFLoader().loadAsync(MODEL_URL);
    const model = gltf.scene;

    // ปรับขนาดและตำแหน่งตรงนี้
    model.scale.setScalar(1);
    model.position.set(0, 0, 0);
    model.rotation.set(0, 0, 0);

    // จุดติดตามใบหน้า
    const anchor = mindar.addAnchor(1);
    anchor.group.add(model);

    // เก็บ Mesh ที่มี Blendshape
    const meshes = [];

    model.traverse(object => {
      if (
        object.isMesh &&
        object.morphTargetDictionary &&
        object.morphTargetInfluences
      ) {
        meshes.push(object);
        console.log(
          'Blendshapes:',
          Object.keys(object.morphTargetDictionary)
        );
      }
    });

    await mindar.start();

    // ป้องกันการเริ่ม animation ซ้ำ
    renderer.setAnimationLoop(() => {
      const categories =
        mindar.getLatestEstimate()?.blendshapes?.categories ?? [];

      for (const mesh of meshes) {
        for (const { categoryName, score } of categories) {
          const index =
            mesh.morphTargetDictionary[categoryName];

          if (index !== undefined) {
            mesh.morphTargetInfluences[index] = score;
          }
        }
      }

      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
