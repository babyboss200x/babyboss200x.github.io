
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Boss Face AR</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
    }
  }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    #container {
      width: 100vw;
      height: 100dvh;
      position: relative;
      overflow: hidden;
    }

    #status {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: 90%;
      max-width: 500px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.75);
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    #startButton {
      position: absolute;
      z-index: 20;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 15px 25px;
      border: none;
      border-radius: 12px;
      background: #00c896;
      color: #111;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #retryButton {
      position: absolute;
      z-index: 20;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      display: none;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>
  <div id="container">
    <div id="status">พร้อมเริ่มต้นระบบ Face Tracking</div>
    <button id="startButton">เปิดกล้อง</button>
    <button id="retryButton">ลองใหม่</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { MindARThree } from 'mindar-face-three';

    const container = document.querySelector('#container');
    const status = document.querySelector('#status');
    const startButton = document.querySelector('#startButton');
    const retryButton = document.querySelector('#retryButton');

    // ใช้ URL ของไฟล์ GLB โดยตรงจาก GitHub
    const MODEL_URL =
      'https://raw.githubusercontent.com/babyboss200x/babyboss200x.github.io/main/boss16.glb';

    let mindar = null;
    let started = false;
    let starting = false;
    let modelLoaded = false;

    const setStatus = (message) => {
      status.textContent = message;
    };

    function showError(message) {
      setStatus(message);
      retryButton.style.display = 'block';
      startButton.style.display = 'none';
      console.error(message);
    }

    async function startAR() {
      if (started || starting) return;

      starting = true;
      startButton.disabled = true;
      retryButton.style.display = 'none';

      try {
        // ตรวจสอบการรองรับกล้อง
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error(
            'เบราว์เซอร์ไม่รองรับกล้อง กรุณาเปิดผ่าน HTTPS หรือ localhost'
          );
        }

        setStatus('กำลังเริ่มกล้อง... กรุณากดอนุญาตใช้งานกล้อง');

        // สร้าง MindAR
        mindar = new MindARThree({
          container: container,
          uiLoading: 'no',
          uiScanning: 'no',
          uiError: 'no',
          maxTrack: 1
        });

        const { renderer, scene, camera } = mindar;

        renderer.setPixelRatio(
          Math.min(window.devicePixelRatio || 1, 2)
        );

        renderer.setSize(
          container.clientWidth,
          container.clientHeight
        );

        // แสง
        scene.add(
          new THREE.HemisphereLight(0xffffff, 0x777788, 2)
        );

        const light = new THREE.DirectionalLight(0xffffff, 2);
        light.position.set(0, 1, 2);
        scene.add(light);

        // เริ่มกล้องก่อนโหลดโมเดล
        await mindar.start();

        started = true;
        starting = false;
        startButton.style.display = 'none';

        setStatus('กล้องทำงานแล้ว กำลังโหลดโมเดล...');

        // เริ่มแสดงภาพจากกล้องและเรนเดอร์ทันที
        renderer.setAnimationLoop(() => {
          renderer.render(scene, camera);
        });

        // สร้างจุดติดตามใบหน้า
        const anchor = mindar.addAnchor(168);

        // โหลดโมเดลโดยไม่หยุดการทำงานของกล้องหากโหลดไม่สำเร็จ
        try {
          const loader = new THREE.GLTFLoader();
          const gltf = await loader.loadAsync(MODEL_URL);
          const model = gltf.scene;

          // ปรับโมเดลให้มีขนาดเริ่มต้นที่เหมาะสม
          // ใช้ bounding box เพื่อไม่ให้ขนาดเดิมของไฟล์ใหญ่เกินไป
          model.updateMatrixWorld(true);

          const box = new THREE.Box3().setFromObject(model);
          const size = box.getSize(new THREE.Vector3());
          const center = box.getCenter(new THREE.Vector3());

          const maxDimension = Math.max(size.x, size.y, size.z);

          if (!Number.isFinite(maxDimension) || maxDimension <= 0) {
            throw new Error('โมเดลไม่มีขนาดที่ใช้งานได้');
          }

          // ความสูง/กว้างสูงสุดเริ่มต้นประมาณ 0.35 หน่วย
          const targetSize = 0.35;
          model.scale.setScalar(targetSize / maxDimension);

          // จัดจุดกึ่งกลางโมเดลให้อยู่ใกล้จุดยึดใบหน้า
          model.position.set(
            -center.x * model.scale.x,
            -center.y * model.scale.y,
            -center.z * model.scale.z
          );

          // หากโมเดลหันผิดทิศ ให้ปรับ rotation ตรงนี้
          // ตัวอย่าง: model.rotation.y = Math.PI;
          model.rotation.set(0, 0, 0);

          anchor.group.add(model);

          // ค้นหา Blendshape ที่โมเดลรองรับ
          const meshes = [];

          model.traverse((object) => {
            if (
              object.isMesh &&
              object.morphTargetDictionary &&
              object.morphTargetInfluences
            ) {
              meshes.push(object);

              console.log(
                'Blendshapes:',
                Object.keys(object.morphTargetDictionary)
              );
            }
          });

          modelLoaded = true;

          setStatus(
            meshes.length
              ? 'เปิดกล้องสำเร็จ โหลดโมเดลแล้ว และพบ Blendshape'
              : 'เปิดกล้องสำเร็จ โหลดโมเดลแล้ว แต่ไม่พบ Blendshape'
          );

          // เชื่อมค่าการขยับใบหน้ากับ Morph Targets
          renderer.setAnimationLoop(() => {
            const categories =
              mindar.getLatestEstimate()?.blendshapes?.categories ?? [];

            for (const mesh of meshes) {
              for (const { categoryName, score } of categories) {
                const index =
                  mesh.morphTargetDictionary[categoryName];

                if (index !== undefined) {
                  mesh.morphTargetInfluences[index] = score;
                }
              }
            }

            renderer.render(scene, camera);
          });

        } catch (modelError) {
          console.error('Model loading error:', modelError);

          setStatus(
            'กล้องทำงานแล้ว แต่โหลดโมเดลไม่สำเร็จ ตรวจสอบ URL ของไฟล์ GLB'
          );
        }

      } catch (error) {
        console.error('Camera / MindAR error:', error);

        if (error.name === 'NotAllowedError') {
          showError('ไม่ได้รับอนุญาตให้ใช้กล้อง กรุณาอนุญาตในเบราว์เซอร์');
        } else if (error.name === 'NotFoundError') {
          showError('ไม่พบกล้อง กรุณาตรวจสอบเว็บแคมหรือกล้องในอุปกรณ์');
        } else {
          showError('เปิดกล้องไม่สำเร็จ: ' + error.message);
        }

        if (mindar) {
          try {
            await mindar.stop();
          } catch (e) {
            console.warn(e);
          }
          mindar = null;
        }

        started = false;
        starting = false;
        startButton.disabled = false;
        startButton.style.display = 'block';
      }
    }

    startButton.addEventListener('click', startAR);

    retryButton.addEventListener('click', () => {
      retryButton.style.display = 'none';
      startButton.style.display = 'block';
      startAR();
    });

    window.addEventListener('resize', () => {
      if (mindar) {
        mindar.renderer.setSize(
          container.clientWidth,
          container.clientHeight
        );
      }
    });
  </script>
</body>
</html>
