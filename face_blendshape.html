
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boss Face Tracking</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #container {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    #status {
      position: absolute;
      z-index: 10;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 14px;
      background: #222c;
      color: white;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
      max-width: 94%;
    }

    #controls {
      position: absolute;
      z-index: 10;
      left: 0;
      bottom: 12px;
      width: 100%;
      padding: 8px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    button {
      padding: 10px 12px;
      border: 1px solid #666;
      border-radius: 8px;
      color: white;
      background: #222e;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>

<body>
<div id="container">
  <div id="status">กำลังโหลด bossfinal.glb...</div>

  <div id="controls">
    <button id="left">← ซ้าย</button>
    <button id="right">ขวา →</button>
    <button id="up">↑ ขึ้น</button>
    <button id="down">↓ ลง</button>
    <button id="near">เข้าใกล้</button>
    <button id="far">ถอยออก</button>
    <button id="smaller">เล็กลง</button>
    <button id="bigger">ใหญ่ขึ้น</button>
    <button id="reset">รีเซ็ต</button>
  </div>
</div>

<script type="module">
  import * as THREE from 'three';

  import { GLTFLoader } from
    'three/addons/loaders/GLTFLoader.js';

  import { MindARThree } from 'mindar-face-three';

  // ==========================================
  // 1. URL โมเดล
  // ==========================================

  const MODEL_URL =
    'https://babyboss200x.github.io/bossfinal.glb';

  const container = document.querySelector('#container');
  const status = document.querySelector('#status');

  // ==========================================
  // 2. ค่าปรับตำแหน่ง
  // ==========================================

  // ปรับเพิ่มหรือลดได้หลังเปิดกล้อง
  let offsetX = 0;
  let offsetY = -0.08;
  let offsetZ = 0.04;
  let userScale = 1;

  const initial = {
    x: offsetX,
    y: offsetY,
    z: offsetZ,
    scale: userScale
  };

  let wrapper = null;
  let meshes = [];
  let originalMorphValues = [];

  // ==========================================
  // 3. เริ่ม MindAR
  // ==========================================

  const mindar = new MindARThree({
    container,
    maxTrack: 1
  });

  const { renderer, scene, camera } = mindar;

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
  );

  renderer.outputColorSpace = THREE.SRGBColorSpace;

  // แสง
  scene.add(
    new THREE.HemisphereLight(
      0xffffff,
      0x777788,
      1.8
    )
  );

  const light = new THREE.DirectionalLight(
    0xffffff,
    2
  );

  light.position.set(0, 1, 2);
  scene.add(light);

  // ==========================================
  // 4. ปรับตำแหน่งและขนาด
  // ==========================================

  function updateTransform() {
    if (!wrapper) return;

    wrapper.position.set(
      offsetX,
      offsetY,
      offsetZ
    );

    wrapper.scale.setScalar(userScale);
  }

  function moveX(amount) {
    offsetX += amount;
    updateTransform();
  }

  function moveY(amount) {
    offsetY += amount;
    updateTransform();
  }

  function moveZ(amount) {
    offsetZ += amount;
    updateTransform();
  }

  document.querySelector('#left').onclick =
    () => moveX(-0.02);

  document.querySelector('#right').onclick =
    () => moveX(0.02);

  document.querySelector('#up').onclick =
    () => moveY(0.02);

  document.querySelector('#down').onclick =
    () => moveY(-0.02);

  document.querySelector('#near').onclick =
    () => moveZ(0.02);

  document.querySelector('#far').onclick =
    () => moveZ(-0.02);

  document.querySelector('#smaller').onclick = () => {
    userScale = Math.max(0.1, userScale * 0.9);
    updateTransform();
  };

  document.querySelector('#bigger').onclick = () => {
    userScale = Math.min(3, userScale * 1.1);
    updateTransform();
  };

  document.querySelector('#reset').onclick = () => {
    offsetX = initial.x;
    offsetY = initial.y;
    offsetZ = initial.z;
    userScale = initial.scale;
    updateTransform();
  };

  // ==========================================
  // 5. โหลดโมเดลและจัดขนาดอัตโนมัติ
  // ==========================================

  try {
    status.textContent = 'กำลังโหลดโมเดล...';

    const loader = new GLTFLoader();
    const gltf = await loader.loadAsync(MODEL_URL);

    const model = gltf.scene;

    // คำนวณขอบเขตโมเดล
    model.updateMatrixWorld(true);

    const bounds = new THREE.Box3()
      .setFromObject(model);

    const size = bounds.getSize(new THREE.Vector3());
    const center = bounds.getCenter(new THREE.Vector3());

    if (
      !Number.isFinite(size.x) ||
      !Number.isFinite(size.y) ||
      size.x <= 0 ||
      size.y <= 0
    ) {
      throw new Error('โมเดลไม่มีขนาดที่ถูกต้อง');
    }

    // ย้ายจุดกลางโมเดลมาใกล้ Origin
    // เพื่อให้ปุ่มเลื่อนตำแหน่งทำงานได้ง่าย
    model.position.sub(center);

    // ตั้งความกว้างเป้าหมายของโมเดล
    // ใช้สัดส่วนจากโมเดลจริงแทนการใช้สเกลเดิมแบบสุ่ม
    const targetWidth = 0.9;
    const autoScale = targetWidth / size.x;

    wrapper = new THREE.Group();
    wrapper.add(model);

    // ใช้ autoScale เป็นฐาน แล้วคูณด้วย userScale
    wrapper.scale.setScalar(autoScale * userScale);

    wrapper.position.set(
      offsetX,
      offsetY,
      offsetZ
    );

    // ==========================================
    // 6. หา Blendshape
    // ==========================================

    model.traverse((object) => {
      if (
        object.isMesh &&
        object.morphTargetDictionary &&
        object.morphTargetInfluences
      ) {
        meshes.push(object);
      }
    });

    // ==========================================
    // 7. Face Anchor
    // ==========================================

    // จุด 168 อยู่บริเวณสันจมูกใน face mesh
    const anchor = mindar.addAnchor(168);
    anchor.group.add(wrapper);

    status.textContent = 'กำลังเปิดกล้อง...';

    await mindar.start();

    status.textContent =
      `ติดตามใบหน้าแล้ว | Morph Mesh: ${meshes.length}`;

    // ==========================================
    // 8. อัปเดต Blendshape
    // ==========================================

    renderer.setAnimationLoop(() => {
      const categories =
        mindar.getLatestEstimate()?.blendshapes?.categories;

      if (categories) {
        for (const mesh of meshes) {
          for (const { categoryName, score } of categories) {
            const index =
              mesh.morphTargetDictionary[categoryName];

            if (index !== undefined) {
              mesh.morphTargetInfluences[index] = score;
            }
          }
        }
      }

      renderer.render(scene, camera);
    });

    // แสดงขนาดที่คำนวณได้ใน Console
    console.log('Model size:', size);
    console.log('Automatic scale:', autoScale);
    console.log('Blendshape meshes:', meshes.length);

  } catch (error) {
    console.error('MindAR error:', error);

    status.textContent =
      'โหลดโมเดลหรือเปิดกล้องไม่สำเร็จ กรุณาตรวจสอบ Console';
  }

  // ==========================================
  // 9. รองรับการเปลี่ยนขนาดหน้าจอ
  // ==========================================

  window.addEventListener('resize', () => {
    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );
  });
</script>
</body>
</html>
