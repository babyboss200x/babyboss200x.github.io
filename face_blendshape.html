
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MindAR Blendshape</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
    }
  }
  </script>

  <style>
    body {
      margin: 0;
    }

    #container {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { MindARThree } from 'mindar-face-three';

    const container = document.querySelector('#container');

    const mindar = new MindARThree({ container });
    const { renderer, scene, camera } = mindar;

    // Environment แสงสตูดิโอ
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    const roomEnvironment = new RoomEnvironment();
    const environmentTarget =
      pmremGenerator.fromScene(roomEnvironment);

    scene.environment = environmentTarget.texture;

    roomEnvironment.dispose();
    pmremGenerator.dispose();

    scene.add(
      new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1)
    );

    // โหลดโมเดล boss_18.glb จาก GitHub
    const gltf = await new GLTFLoader().loadAsync(
      'https://raw.githubusercontent.com/babyboss200x/babyboss200x.github.io/main/boss_18.glb'
    );

    const model = gltf.scene;

    // จัดกึ่งกลางโมเดลตามขนาดจริงในไฟล์
    model.updateMatrixWorld(true);

    const bounds = new THREE.Box3().setFromObject(model);
    const size = bounds.getSize(new THREE.Vector3());
    const center = bounds.getCenter(new THREE.Vector3());

    const maxDimension = Math.max(size.x, size.y, size.z);

    if (!Number.isFinite(maxDimension) || maxDimension <= 0) {
      throw new Error('ไม่สามารถอ่านขนาดโมเดลได้');
    }

    // ปรับขนาดโมเดลให้เหมาะกับพื้นที่ใบหน้า
    // ค่านี้คือขนาดสูงสุดของโมเดลหลังปรับ
    const targetSize = 1.2;
    const fitScale = targetSize / maxDimension;

    // ใช้กลุ่มแยกเพื่อจัดตำแหน่ง โดยไม่แก้ geometry ต้นฉบับ
    const modelGroup = new THREE.Group();

    model.position.set(-center.x, -center.y, -center.z);
    modelGroup.add(model);
    modelGroup.scale.setScalar(fitScale);

    // ตำแหน่งเริ่มต้นเทียบกับจุดยึดใบหน้า
    modelGroup.position.set(0, -0.05, 0);

    // ใช้จุดยึดจมูกเหมือนโค้ดต้นฉบับ
    const anchor = mindar.addAnchor(1);
    anchor.group.add(modelGroup);

    // ค้นหา Blendshape ของโมเดล
    const meshes = [];

    model.traverse(object => {
      if (
        object.isMesh &&
        object.morphTargetDictionary &&
        object.morphTargetInfluences
      ) {
        meshes.push(object);

        console.log(
          'Morph Targets:',
          Object.keys(object.morphTargetDictionary)
        );
      }
    });

    console.log('Original model size:', size);
    console.log('Model scale:', fitScale);

    await mindar.start();

    function animate() {
      const categories =
        mindar.getLatestEstimate()?.blendshapes?.categories;

      for (const mesh of meshes) {
        for (const { categoryName, score } of categories ?? []) {
          const index =
            mesh.morphTargetDictionary[categoryName];

          if (index !== undefined) {
            mesh.morphTargetInfluences[index] = score;
          }
        }
      }

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
