
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MindAR Face Tracking</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
    }
  }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #container {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    #status {
      position: fixed;
      z-index: 10;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 12px;
      color: white;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div id="container"></div>
  <div id="status">กำลังเตรียมระบบ...</div>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
    import { MindARThree } from "mindar-face-three";

    const MODEL_URL =
      "https://babyboss200x.github.io/bossfinal02.glb";

    const container = document.querySelector("#container");
    const status = document.querySelector("#status");

    async function main() {
      status.textContent = "กำลังโหลดโมเดล...";

      // สร้างระบบ MindAR
      const mindar = new MindARThree({
        container: container
      });

      const { renderer, scene, camera } = mindar;

      // แสงและ Environment
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      const roomEnvironment = new RoomEnvironment();
      const environmentTarget =
        pmremGenerator.fromScene(roomEnvironment);

      scene.environment = environmentTarget.texture;

      roomEnvironment.dispose();
      pmremGenerator.dispose();

      scene.add(
        new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1)
      );

      // โหลดโมเดล GLB จาก GitHub Pages
      let gltf;

      try {
        gltf = await new GLTFLoader().loadAsync(MODEL_URL);
      } catch (error) {
        console.error("โหลดโมเดลไม่สำเร็จ:", error);
        status.textContent =
          "โหลดโมเดลไม่ได้ กรุณาตรวจสอบว่าไฟล์ bossfinal02.glb อยู่ใน Repository และเปิดลิงก์ไฟล์ได้";
        throw error;
      }

      const model = gltf.scene;

      // ขนาดเริ่มต้นของโมเดล
      model.scale.setScalar(2);

      // เพิ่มโมเดลลงใน Face Anchor
      const anchor = mindar.addAnchor(1);
      anchor.group.add(model);

      // ค้นหา Mesh ที่มี Morph Targets
      const meshes = [];

      model.traverse((object) => {
        if (
          object.isMesh &&
          object.morphTargetDictionary &&
          object.morphTargetInfluences
        ) {
          meshes.push(object);
        }
      });

      console.log("โหลดโมเดลสำเร็จ:", MODEL_URL);
      console.log("จำนวน Mesh ที่รองรับ Blendshape:", meshes.length);

      status.textContent = "กำลังเปิดกล้อง...";

      // เริ่มระบบตรวจจับใบหน้า
      await mindar.start();

      status.textContent = "กล้องพร้อมใช้งาน กรุณาหันหน้าเข้าหากล้อง";

      // อัปเดต Blendshape
      renderer.setAnimationLoop(() => {
        const categories =
          mindar.getLatestEstimate()?.blendshapes?.categories;

        for (const mesh of meshes) {
          for (const { categoryName, score } of categories ?? []) {
            const index =
              mesh.morphTargetDictionary[categoryName];

            if (index !== undefined) {
              mesh.morphTargetInfluences[index] = score;
            }
          }
        }

        renderer.render(scene, camera);
      });
    }

    main().catch((error) => {
      console.error(error);

      if (
        !status.textContent.includes("โหลดโมเดลไม่ได้")
      ) {
        status.textContent =
          "เปิดไม่สำเร็จ: " +
          (error.message || "เกิดข้อผิดพลาด กรุณาดู Console");
      }
    });
  </script>
</body>
</html>
