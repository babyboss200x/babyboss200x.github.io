
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boss Face AR</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #container {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    #status {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: #222d;
      color: white;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
      max-width: 94%;
    }

    #controls {
      position: absolute;
      z-index: 10;
      bottom: 12px;
      left: 0;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      padding: 8px;
    }

    button {
      background: #252525eF;
      color: white;
      border: 1px solid #777;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>

<body>
<div id="container">
  <div id="status">กำลังโหลดโมเดล...</div>

  <div id="controls">
    <button id="left">← ซ้าย</button>
    <button id="right">ขวา →</button>
    <button id="up">↑ ขึ้น</button>
    <button id="down">↓ ลง</button>
    <button id="near">เข้าใกล้</button>
    <button id="far">ถอยออก</button>
    <button id="smaller">เล็กลง</button>
    <button id="bigger">ใหญ่ขึ้น</button>
    <button id="reset">รีเซ็ต</button>
  </div>
</div>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from
    'three/addons/loaders/GLTFLoader.js';
  import { MindARThree } from 'mindar-face-three';

  // =========================================
  // URL โมเดลจาก GitHub Pages
  // =========================================

  const MODEL_URL =
    'https://babyboss200x.github.io/bossfinal.glb';

  const container = document.querySelector('#container');
  const status = document.querySelector('#status');

  // =========================================
  // ค่าเริ่มต้นสำหรับจัดตำแหน่งใบหน้า
  // =========================================

  const DEFAULT = {
    x: 0,
    y: -0.04,
    z: 0.02,
    scale: 1
  };

  let offsetX = DEFAULT.x;
  let offsetY = DEFAULT.y;
  let offsetZ = DEFAULT.z;
  let userScale = DEFAULT.scale;

  // ความกว้างเป้าหมายของโมเดลในหน่วยของฉาก
  // ปรับได้หากหน้ากากยังใหญ่หรือเล็กเกินไป
  const TARGET_WIDTH = 0.75;

  let wrapper = null;
  let autoScale = 1;
  let modelMeshes = [];

  // =========================================
  // เริ่ม MindAR
  // =========================================

  const mindar = new MindARThree({
    container,
    maxTrack: 1
  });

  const { renderer, scene, camera } = mindar;

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
  );

  renderer.outputColorSpace = THREE.SRGBColorSpace;

  scene.add(
    new THREE.HemisphereLight(
      0xffffff,
      0x777788,
      1.8
    )
  );

  const light = new THREE.DirectionalLight(0xffffff, 2);
  light.position.set(0, 1, 2);
  scene.add(light);

  // =========================================
  // อัปเดตตำแหน่งและขนาด
  // =========================================

  function updateTransform() {
    if (!wrapper) return;

    wrapper.position.set(offsetX, offsetY, offsetZ);

    // คงค่า autoScale ไว้แม้กดปุ่มปรับขนาด
    wrapper.scale.setScalar(autoScale * userScale);
  }

  document.querySelector('#left').onclick = () => {
    offsetX -= 0.02;
    updateTransform();
  };

  document.querySelector('#right').onclick = () => {
    offsetX += 0.02;
    updateTransform();
  };

  document.querySelector('#up').onclick = () => {
    offsetY += 0.02;
    updateTransform();
  };

  document.querySelector('#down').onclick = () => {
    offsetY -= 0.02;
    updateTransform();
  };

  document.querySelector('#near').onclick = () => {
    offsetZ += 0.02;
    updateTransform();
  };

  document.querySelector('#far').onclick = () => {
    offsetZ -= 0.02;
    updateTransform();
  };

  document.querySelector('#smaller').onclick = () => {
    userScale = Math.max(0.1, userScale * 0.9);
    updateTransform();
  };

  document.querySelector('#bigger').onclick = () => {
    userScale = Math.min(3, userScale * 1.1);
    updateTransform();
  };

  document.querySelector('#reset').onclick = () => {
    offsetX = DEFAULT.x;
    offsetY = DEFAULT.y;
    offsetZ = DEFAULT.z;
    userScale = DEFAULT.scale;
    updateTransform();
  };

  // =========================================
  // โหลดโมเดล
  // =========================================

  try {
    status.textContent = 'กำลังโหลด bossfinal.glb...';

    const loader = new GLTFLoader();
    const gltf = await loader.loadAsync(MODEL_URL);
    const model = gltf.scene;

    // คำนวณขอบเขตโมเดลจริง
    model.updateMatrixWorld(true);

    const bounds = new THREE.Box3().setFromObject(model);
    const size = bounds.getSize(new THREE.Vector3());
    const center = bounds.getCenter(new THREE.Vector3());

    if (
      !Number.isFinite(size.x) ||
      !Number.isFinite(size.y) ||
      size.x <= 0 ||
      size.y <= 0
    ) {
      throw new Error('ขนาดโมเดลไม่ถูกต้อง');
    }

    // เลื่อนจุดกลางโมเดลมาไว้ที่ Origin
    // เพื่อให้การปรับตำแหน่งทำได้ง่ายขึ้น
    model.position.sub(center);

    // คำนวณขนาดเริ่มต้นตามความกว้างโมเดล
    autoScale = TARGET_WIDTH / size.x;

    wrapper = new THREE.Group();
    wrapper.add(model);
    updateTransform();

    // ค้นหา Mesh ที่รองรับ Blendshape
    model.traverse(object => {
      if (
        object.isMesh &&
        object.morphTargetDictionary &&
        object.morphTargetInfluences
      ) {
        modelMeshes.push(object);
      }
    });

    // Anchor บริเวณสันจมูก
    // จุดกลางของโมเดลจะอ้างอิงตำแหน่งนี้
    const anchor = mindar.addAnchor(168);
    anchor.group.add(wrapper);

    status.textContent = 'กำลังเปิดกล้อง...';
    await mindar.start();

    status.textContent = 'กำลังติดตามใบหน้า';

    // =========================================
    // อัปเดต Blendshape และแสดงผล
    // =========================================

    renderer.setAnimationLoop(() => {
      const categories =
        mindar.getLatestEstimate()?.blendshapes?.categories;

      if (categories) {
        for (const mesh of modelMeshes) {
          for (const { categoryName, score } of categories) {
            const index =
              mesh.morphTargetDictionary[categoryName];

            if (index !== undefined) {
              mesh.morphTargetInfluences[index] = score;
            }
          }
        }
      }

      renderer.render(scene, camera);
    });

    console.log('Model dimensions:', size);
    console.log('Auto scale:', autoScale);
    console.log('Blendshape meshes:', modelMeshes.length);

  } catch (error) {
    console.error('Face tracking error:', error);

    status.textContent =
      'โหลดไม่สำเร็จ ตรวจสอบ URL โมเดลและสิทธิ์กล้อง';
  }

  window.addEventListener('resize', () => {
    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );
  });
</script>
</body>
</html>
